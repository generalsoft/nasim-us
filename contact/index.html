</button>

<script>
(function () {
  const button = document.getElementById("theme-toggle");
  const root = document.documentElement;
  const icon = button.querySelector(".theme-toggle-icon");

  function applyTheme(theme) {
    root.setAttribute("data-theme", theme);
    icon.textContent = theme === "dark" ? "☀" : "☾";

    button.setAttribute(
      "aria-label",
      theme === "dark"
        ? "Switch to light mode"
        : "Switch to dark mode"
    );
  }

  const savedTheme = localStorage.getItem("theme");

  if (savedTheme === "dark" || savedTheme === "light") {
    applyTheme(savedTheme);
  } else {
    const prefersDark =
      window.matchMedia &&
      window.matchMedia("(prefers-color-scheme: dark)").matches;

    applyTheme(prefersDark ? "dark" : "light");
  }

  button.addEventListener("click", function () {
    const current =
      root.getAttribute("data-theme") === "dark"
        ? "dark"
        : "light";

    const next = current === "dark" ? "light" : "dark";

    localStorage.setItem("theme", next);
    applyTheme(next);
  });
})();
</script>

<script>
(function () {
  var root = document.documentElement;

  // A much wider range than before: 70% … 250%, with more choices packed around
  // the comfortable middle where most readers settle.
  var FONT_STEPS = [0.7, 0.8, 0.9, 1, 1.15, 1.3, 1.5, 1.75, 2, 2.25, 2.5];
  var DEFAULT_STEP_INDEX = 3; // index of 1 => 100%

  var toggle = document.getElementById("reader-tools-toggle");
  var panel = document.getElementById("reader-tools-panel");
  var decreaseBtn = document.getElementById("reader-font-decrease");
  var increaseBtn = document.getElementById("reader-font-increase");
  var resetBtn = document.getElementById("reader-font-reset");
  var valueLabel = document.getElementById("reader-font-value");
  var fontSelect = document.getElementById("reader-font-select");
  var widthNormalBtn = document.getElementById("reader-width-normal");
  var widthWideBtn = document.getElementById("reader-width-wide");
  var relaxedCheckbox = document.getElementById("reader-relaxed-spacing");
  var underlineCheckbox = document.getElementById("reader-underline-links");
  var focusCheckbox = document.getElementById("reader-focus-mode");
  var hideCoverCheckbox = document.getElementById("reader-hide-cover");

  function readStoredIndex() {
    var raw = localStorage.getItem("readerFontStepIndex");
    var index = raw === null ? DEFAULT_STEP_INDEX : parseInt(raw, 10);

    if (isNaN(index) || index < 0 || index >= FONT_STEPS.length) {
      index = DEFAULT_STEP_INDEX;
    }

    return index;
  }

  function applyFontStep(index) {
    root.style.setProperty("--reader-scale", String(FONT_STEPS[index]));
    localStorage.setItem("readerFontStepIndex", String(index));
    valueLabel.textContent = Math.round(FONT_STEPS[index] * 100) + "%";

    decreaseBtn.disabled = index === 0;
    increaseBtn.disabled = index === FONT_STEPS.length - 1;
  }

  function applyFont(stack) {
    if (!stack) return;

    root.style.setProperty("--reader-font", stack);
    localStorage.setItem("readerFont", stack);
  }

  function applyWidth(mode) {
    var wide = mode === "wide";

    root.classList.toggle("reading-wide", wide);
    localStorage.setItem("readerWidth", wide ? "wide" : "normal");
    widthNormalBtn.setAttribute("aria-pressed", String(!wide));
    widthWideBtn.setAttribute("aria-pressed", String(wide));
  }

  function applyRelaxedSpacing(enabled) {
    root.classList.toggle("reading-relaxed", enabled);
    localStorage.setItem("readerRelaxedSpacing", enabled ? "1" : "0");
    relaxedCheckbox.checked = enabled;
  }

  function applyUnderlineLinks(enabled) {
    root.classList.toggle("reading-underline-links", enabled);
    localStorage.setItem("readerUnderlineLinks", enabled ? "1" : "0");
    underlineCheckbox.checked = enabled;
  }

  function applyFocus(enabled) {
    root.classList.toggle("reading-focus", enabled);
    localStorage.setItem("readerFocus", enabled ? "1" : "0");
    focusCheckbox.checked = enabled;

    if (enabled) {
      updateProgress();
    }
  }

  function applyHideCover(enabled) {
    root.classList.toggle("reading-hide-cover", enabled);
    localStorage.setItem("readerHideCover", enabled ? "1" : "0");
    hideCoverCheckbox.checked = enabled;
  }

  function updateProgress() {
    // The progress line is rendered after this script in the document
    // (see _includes/header.html), so it is resolved on demand rather than at
    // parse time — and simply skipped until it exists.
    var bar = document.getElementById("reading-progress-bar");
    if (!bar) return;

    var doc = document.documentElement;
    var max = doc.scrollHeight - doc.clientHeight;
    var ratio = max > 0 ? doc.scrollTop / max : 0;

    bar.style.width = Math.min(100, Math.max(0, ratio * 100)) + "%";
  }

  // Restore saved preferences on load.
  var currentIndex = readStoredIndex();
  applyFontStep(currentIndex);

  if (fontSelect) {
    var storedFont = localStorage.getItem("readerFont");

    if (storedFont) {
      for (var i = 0; i < fontSelect.options.length; i++) {
        if (fontSelect.options[i].value === storedFont) {
          fontSelect.selectedIndex = i;
          break;
        }
      }
    }

    applyFont(fontSelect.value);

    fontSelect.addEventListener("change", function () {
      applyFont(fontSelect.value);
    });
  }

  applyWidth(localStorage.getItem("readerWidth"));
  applyRelaxedSpacing(localStorage.getItem("readerRelaxedSpacing") === "1");
  applyUnderlineLinks(localStorage.getItem("readerUnderlineLinks") === "1");
  applyFocus(localStorage.getItem("readerFocus") === "1");
  applyHideCover(localStorage.getItem("readerHideCover") === "1");

  toggle.addEventListener("click", function () {
    var isOpen = !panel.hidden;
    panel.hidden = isOpen;
    toggle.setAttribute("aria-expanded", String(!isOpen));
  });

  document.addEventListener("click", function (event) {
    if (!panel.hidden && !panel.contains(event.target) && event.target !== toggle) {
      panel.hidden = true;
      toggle.setAttribute("aria-expanded", "false");
    }
  });

  decreaseBtn.addEventListener("click", function () {
    currentIndex = Math.max(0, currentIndex - 1);
    applyFontStep(currentIndex);
  });

  increaseBtn.addEventListener("click", function () {
    currentIndex = Math.min(FONT_STEPS.length - 1, currentIndex + 1);
    applyFontStep(currentIndex);
  });

  resetBtn.addEventListener("click", function () {
    currentIndex = DEFAULT_STEP_INDEX;
    applyFontStep(currentIndex);
  });

  widthNormalBtn.addEventListener("click", function () {
    applyWidth("normal");
  });

  widthWideBtn.addEventListener("click", function () {
    applyWidth("wide");
  });

  relaxedCheckbox.addEventListener("change", function () {
    applyRelaxedSpacing(relaxedCheckbox.checked);
  });

  underlineCheckbox.addEventListener("change", function () {
    applyUnderlineLinks(underlineCheckbox.checked);
  });

  focusCheckbox.addEventListener("change", function () {
    applyFocus(focusCheckbox.checked);
  });

  hideCoverCheckbox.addEventListener("change", function () {
    applyHideCover(hideCoverCheckbox.checked);
  });

  // Focus mode: the floating button and the Esc key both leave it; a thin
  // progress line (shown only in focus mode) tracks how far the reader has got.
  // The exit button is rendered after this script (see _includes/header.html),
  // so clicks are handled with event delegation instead of a parse-time lookup,
  // which would find nothing.
  document.addEventListener("click", function (event) {
    if (event.target && event.target.closest && event.target.closest("#focus-exit")) {
      applyFocus(false);
    }
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && root.classList.contains("reading-focus")) {
      applyFocus(false);
    }
  });

  window.addEventListener("scroll", updateProgress, { passive: true });
  window.addEventListener("resize", updateProgress);
})();
</script>
